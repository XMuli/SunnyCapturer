<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SunnyCapturer</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="legacy-assets/vue.css">
</head>

<body>
  <nav>
    <a href="#/">EN</a>
    <a href="#/zh-cn/">中文</a>
  </nav>
  <div id="app"></div>
  <script>
    window.$docsify = {
      repo: 'https://github.com/XMuli/SunnyCapturer',
      logo: 'logo.svg height="32px"',
      name: 'Sunny Capturer',
      nameLink: {
        '/zh-cn/': '#/zh-cn/',
        '/': '/'
      },
      maxLevel: 3,
      subMaxLevel: 2,
      auto2top: true,
      loadSidebar: true,      // 定制侧边栏
      autoHeader: true,       // 根据 _sidebar.md 的内容自动为每个页面增加标题
      routerMode: 'hash', // default: 'hash'
      coverpage: true,      // 封面
      // externalLinkTarget: '_self', // default: '_blank'   
      // themeColor: '#3F51B5',
      // ga: 'UA-XXXXX-Y'
      formatUpdated: '{YYYY}.{MM}.{DD} {HH}:{mm}',
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      }
    }
  </script>
  <!-- Docsify v4, self-hosted for fast first paint -->
  <script src="legacy-assets/docsify.min.js"></script>
  <script src="legacy-assets/emoji.min.js"></script>
  <script src="legacy-assets/docsify-copy-code.min.js"></script>
  <script src="legacy-assets/countable.js"></script>
  <script src="legacy-assets/zoom-image.min.js"></script>

  <script src="legacy-assets/prism-bash.min.js"></script>
  <script src="legacy-assets/prism-php.min.js"></script>

</body>

</html>
